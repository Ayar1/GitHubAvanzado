name: CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
  workflow_dispatch:

jobs:
  updateversion:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Actualizar versión
        run: |
          sed -i "s/AppVersion-0/AppVersion-1/" README.md
          echo "Fecha: $(date)" >> README.md

  validate-prod:
    runs-on: self-hosted
    needs: updateversion

    steps:
      - name: Validar PROD_TOKEN
        shell: cmd
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if "%PROD_TOKEN%"=="%LOCAL_PROD_TOKEN%" (
            echo TOKENS COINCIDEN
            exit /b 0
          ) else (
            echo TOKENS DISTINTOS
            exit /b 1
          )
